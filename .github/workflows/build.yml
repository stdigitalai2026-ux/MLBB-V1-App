name: Build Wrapper APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/butter/webapp
        mkdir -p app/src/main/res/values
        
        # File build.gradle
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.butter.webapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.butter.webapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF
        
        # File AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="MLBB AI Analyzer" android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # File MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/butter/webapp/MainActivity.kt
        package com.butter.webapp
        import android.app.Activity
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebViewClient
        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val webView = WebView(this)
                webView.webViewClient = WebViewClient()
                webView.settings.javaScriptEnabled = true
                // GANTI URL DI BAWAH DENGAN LINK AI STUDIO KAMU
                webView.loadUrl("https://aistudio.google.com/apps/be")
                setContentView(webView)
            }
        }
        EOF
        
        # File settings.gradle
        echo "rootProject.name = 'MLBBWebApp'" > settings.gradle
        echo "include ':app'" >> settings.gradle
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
        # File build.gradle root
        echo "buildscript { dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MLBB-Wrapper-APK
        path: app/build/outputs/apk/debug/app-debug.apk
